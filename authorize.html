<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授权登录 | 武理资源共享平台</title>
    <link rel="icon" href="favicon.webp" type="image/webp">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="lib/fontawesome/css/all.min.css">
    <script src="theme-init.js"></script>
</head>

<body class="oauth-page-body">
    <div id="authorize-container" class="oauth-authorize-container">
        <div class="oauth-card" role="status" aria-live="polite">
            <div class="oauth-loader" aria-hidden="true">
                <span class="oauth-loader-track"></span>
                <span class="oauth-loader-ring"></span>
                <span class="oauth-loader-orbit"><span class="oauth-loader-satellite"></span></span>
                <div class="oauth-icon oauth-loader-core"><i class="fas fa-shield-alt"></i></div>
            </div>
            <h2>正在验证授权请求</h2>
            <p class="oauth-desc">请稍候，正在检查你的登录状态和授权信息<span class="oauth-loading-dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
        </div>
    </div>
    <div class="oauth-page-footer">武理资源共享平台 · SSO · <a href="terms.html" target="_blank"
            rel="noopener">用户协议</a> · <a href="privacy.html" target="_blank" rel="noopener">隐私政策</a></div>
    <script src="config.js"></script>
    <script src="oauth.js"></script>
</body>

</html>
